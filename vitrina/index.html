<style>
/* Layout: sticky top bar with progress; left lesson rail on desktop, slide-over on phone; one 720px reading column */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --fg:#171A21; --muted:#5C6473; --line:#D9DDE5; --line-strong:#B9C0CC;
  --accent:#F2A33A; --accent-ink:#8A5200; --accent-soft:#FFF1DC;
  --code-bg:#1C2129; --code-fg:#E7EAF0; --code-tag:#8FD3FF; --code-attr:#FFD27A; --code-str:#B8F08F; --code-cmt:#7B8595; --code-p:#9AA3B2;
  --ok:#2F8F5B; --ok-soft:#E3F5EA; --bad:#C8463A; --bad-soft:#FBE7E4;
  --display:"Unbounded",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --rail-w:300px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151B; --surface:#1B1F27; --fg:#E8EAEE; --muted:#9AA3B2; --line:#2C323D; --line-strong:#3E4652;
    --accent:#F2A33A; --accent-ink:#FFC46B; --accent-soft:#2E2414;
    --code-bg:#0E1116; --ok:#5FCB8E; --ok-soft:#15301F; --bad:#F08A7E; --bad-soft:#3A1A17;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151B; --surface:#1B1F27; --fg:#E8EAEE; --muted:#9AA3B2; --line:#2C323D; --line-strong:#3E4652;
  --accent:#F2A33A; --accent-ink:#FFC46B; --accent-soft:#2E2414;
  --code-bg:#0E1116; --ok:#5FCB8E; --ok-soft:#15301F; --bad:#F08A7E; --bad-soft:#3A1A17;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
code{font-family:var(--mono);font-size:.92em;background:var(--accent-soft);color:var(--fg);padding:.08em .35em;border-radius:4px}
pre{margin:0}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:14px;min-height:56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.01em;text-decoration:none;color:var(--fg);white-space:nowrap}
.brand b{color:var(--accent)}
.menu-btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:transparent;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;font-size:14px}
.menu-btn svg{width:16px;height:16px}
.prog{margin-left:auto;display:flex;align-items:center;gap:10px;min-width:0}
.bar{width:120px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.prog small{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;white-space:nowrap}

/* shell */
.shell{display:flex;min-height:calc(100% - 57px)}
.rail{width:var(--rail-w);flex:none;border-right:1px solid var(--line);background:var(--surface);
  position:sticky;top:calc(57px + env(safe-area-inset-top,0px));height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow-y:auto;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:12px;padding-block:14px}
.scrim{display:none}
.mod{margin-bottom:16px}
.mod-h{display:flex;align-items:baseline;gap:8px;padding:6px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mod-h i{font-style:normal;margin-left:auto;font-weight:500;letter-spacing:0;text-transform:none}
.ls{list-style:none;margin:0;padding:0}
.ls a{display:grid;grid-template-columns:30px 1fr 18px;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;text-decoration:none;color:var(--fg);font-size:14.5px;line-height:1.3}
.ls a:hover{background:var(--bg)}
.ls a.cur{background:var(--accent-soft)}
.ls a.soon{color:var(--muted)}
.ls .n{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ls .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center}
.ls a.done .st{background:var(--ok);border-color:var(--ok)}
.ls a.done .st::after{content:"";width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:translateY(-1px) rotate(45deg)}
.ls a.soon .st{border-style:dashed}

.view{flex:1;min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.col{max-width:720px;margin:0 auto}

/* home */
.hero{display:grid;gap:14px;padding-bottom:28px;border-bottom:1px solid var(--line);margin-bottom:28px}
.eyebrow{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.1}
.hero h1 b{color:var(--accent)}
.lead{font-size:19px;color:var(--fg);max-width:60ch}
.facts{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:14px;color:var(--muted)}
.facts b{color:var(--fg);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#1A1200;border:0;border-radius:10px;padding:12px 18px;font-weight:700;text-decoration:none;cursor:pointer;font-size:16px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line-strong);font-weight:600}
.btn:focus-visible,.menu-btn:focus-visible,.ls a:focus-visible,.opt:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.how{display:grid;gap:10px;margin-bottom:32px}
.how h2,.mods h2{font-size:20px;font-weight:700;margin-bottom:6px}
.how ol{margin:0;padding-left:22px;display:grid;gap:6px}
.mods{display:grid;gap:12px}
.mcard{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:start;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.mcard .num{font-family:var(--display);font-weight:700;font-size:26px;color:var(--accent);line-height:1}
.mcard h3{font-size:17px;font-weight:700}
.mcard p{color:var(--muted);font-size:15px;margin-top:4px}
.mcard .meta{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.mcard .meta b{display:block;color:var(--fg);font-size:15px}
.note{margin-top:24px;padding:14px 16px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 10px 10px 0;font-size:15px;color:var(--muted)}

/* lesson */
.lhead{display:grid;gap:10px;margin-bottom:24px}
.lhead h1{font-family:var(--display);font-weight:700;font-size:clamp(24px,4.5vw,34px);line-height:1.15}
.result{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;padding:14px 16px;background:var(--accent-soft);border-radius:12px;font-size:16px}
.result .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--accent-ink);padding-top:3px}
.sec{margin-top:36px;display:grid;gap:14px}
.sec h2{font-size:22px;font-weight:700;display:flex;align-items:baseline;gap:10px}
.sec h2 .idx{font-family:var(--mono);font-size:13px;color:var(--muted);font-weight:400}
.sec p,.sec li{max-width:66ch}
.sec ul,.sec ol{margin:0;padding-left:22px;display:grid;gap:8px}
.terms{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.terms li{display:grid;grid-template-columns:minmax(90px,130px) 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);max-width:none}
.terms li:last-child{border-bottom:1px solid var(--line)}
.terms b{font-weight:700}
.code{background:var(--code-bg);color:var(--code-fg);border-radius:12px;overflow:hidden}
.code .cap{display:flex;align-items:center;gap:10px;padding:8px 14px;font-family:var(--mono);font-size:12.5px;color:var(--code-p);border-bottom:1px solid rgba(255,255,255,.07)}
.code .cap .copy{margin-left:auto;background:transparent;border:1px solid rgba(255,255,255,.18);color:var(--code-fg);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
.code pre{padding:14px 16px;overflow-x:auto;font-family:var(--mono);font-size:13.5px;line-height:1.55;tab-size:2}
.code .t{color:var(--code-tag)} .code .a{color:var(--code-attr);font-weight:400} .code .s{color:var(--code-str);font-style:normal} .code .c{color:var(--code-cmt);font-style:italic} .code .p{color:var(--code-p)}
.lines{display:grid;gap:6px;padding:0;margin:0;list-style:none}
.lines li{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:12px;font-size:15px;max-width:none}
.lines code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.callout{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:15.5px}
.callout b{font-weight:700}

/* sandbox */
.sb{display:grid;gap:10px}
.sb-grid{display:grid;grid-template-columns:1fr;gap:10px}
.sb-pane{display:grid;grid-template-rows:auto 1fr;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);min-width:0}
.sb-pane .cap{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
.sb-pane .cap button{margin-left:auto;background:transparent;border:1px solid var(--line-strong);border-radius:6px;padding:2px 8px;font-size:12px;cursor:pointer;letter-spacing:0;text-transform:none}
.sb textarea{width:100%;height:260px;border:0;resize:vertical;padding:12px 14px;background:var(--code-bg);color:var(--code-fg);font-family:var(--mono);font-size:13.5px;line-height:1.55;tab-size:2;outline:none;white-space:pre;overflow:auto}
.sb iframe{width:100%;height:260px;border:0;background:#fff}
.sb-tasks{padding:0;margin:0;list-style:none;display:grid;gap:6px;font-size:15px}
.sb-tasks li{display:flex;gap:10px}
.sb-tasks li::before{content:"→";color:var(--accent);font-weight:700}

/* quiz */
.q{display:grid;gap:10px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.q .qt{font-weight:600}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:15px}
.opt input{margin:3px 0 0;accent-color:var(--accent)}
.q.ok .opt.right{border-color:var(--ok);background:var(--ok-soft)}
.q.bad .opt.picked{border-color:var(--bad);background:var(--bad-soft)}
.q.bad .opt.right{border-color:var(--ok)}
.q .ex{display:none;font-size:14.5px;color:var(--muted);padding-top:4px}
.q.ok .ex,.q.bad .ex{display:block}
.score{font-weight:600;min-height:1.5em}

/* ai */
.prompt{position:relative;padding:14px 16px;border:1px dashed var(--line-strong);border-radius:12px;background:var(--surface);font-size:15.5px;white-space:pre-wrap}
.prompt .copy{position:absolute;top:10px;right:10px;background:var(--bg);border:1px solid var(--line-strong);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer}
.check-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.check-list li{display:flex;gap:10px;font-size:15.5px}
.check-list li::before{content:"✓";color:var(--ok);font-weight:700;flex:none}

/* done / footer nav */
.finish{margin-top:40px;padding:18px;border:1px solid var(--line);border-radius:12px;background:var(--surface);display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.finish p{flex:1 1 200px;color:var(--muted);font-size:15px}
.btn.done{background:var(--ok);color:#fff}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.pager a{text-decoration:none;color:var(--fg);font-weight:600;font-size:15px;padding:10px 0}
.pager a.next{margin-left:auto}
.pager a.next::after{content:" →"} .pager a.prev::before{content:"← "}
.stub{padding:18px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--muted);font-size:15.5px;margin-top:20px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:14px;transition:.25s;pointer-events:none;z-index:20}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (min-width:900px){
  .menu-btn{display:none}
  .sb-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:899px){
  .rail{position:fixed;left:0;top:0;height:100%;z-index:30;transform:translateX(-105%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.25);width:min(var(--rail-w),86vw);padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:29;opacity:0;pointer-events:none;transition:.25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .bar{width:70px}
  .mcard{grid-template-columns:44px 1fr}
  .mcard .meta{grid-column:2;text-align:left;display:flex;gap:10px}
  .mcard .meta b{display:inline}
  .lines li{grid-template-columns:1fr}
  .result{grid-template-columns:1fr;gap:4px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $ = s=>document.querySelector(s);
const esc = s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function hlHtml(src){
  let s = esc(src);
  s = s.replace(/(&lt;!--[\s\S]*?--&gt;)/g,'<span class="c">$1</span>');
  s = s.replace(/(&lt;!doctype[^&]*?&gt;)/gi,'<span class="p">$1</span>');
  s = s.replace(/(&lt;\/?)([a-zA-Z][\w-]*)([\s\S]*?)(\/?&gt;)/g,(m,o,t,a,c)=>{
    a = a.replace(/([\w-]+)(=)(&quot;.*?&quot;)/g,'<span class="a">$1</span>$2<span class="s">$3</span>');
    return `<span class="p">${o}</span><span class="t">${t}</span>${a}<span class="p">${c}</span>`;
  });
  return s;
}
function codeBlock(name,src){
  return `<div class="code"><div class="cap">${esc(name)}<button class="copy" data-copy>Скопировать</button></div><pre data-src="${esc(src)}">${hlHtml(src)}</pre></div>`;
}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("on"),1600);}
function copyText(text,btn){
  const ok=()=>{toast("Скопировано");};
  const fallback=()=>{const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){toast("Выдели и скопируй вручную");}ta.remove();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(ok,fallback);}else fallback();
}

  let t; const run=()=>{fr.srcdoc=ta.value;};
  ta.addEventListener("input",()=>{clearTimeout(t);t=setTimeout(()=>{run();store.set("sv-draft-1",ta.value);},300);});
  $("#sbReset").onclick=()=>{ta.value=SANDBOX_1;store.set("sv-draft-1",SANDBOX_1);run();};
  run();
  const qz=$("#quiz");
  qz.innerHTML = QUIZ_1.map((q,i)=>`<div class="q" data-i="${i}"><div class="qt">${i+1}. ${esc(q.q)}</div>${q.o.map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}" id="q${i}o${j}"><span>${esc(o)}</span></label>`).join("")}<div class="ex">${esc(q.ex)}</div></div>`).join("");
  qz.style.display="grid"; qz.style.gap="12px";
  $("#quizCheck").onclick=()=>{
    let right=0, answered=0;
    QUIZ_1.forEach((q,i)=>{
      const box=qz.querySelector(`.q[data-i="${i}"]`); const picked=box.querySelector("input:checked");
      box.classList.remove("ok","bad"); box.querySelectorAll(".opt").forEach(o=>o.classList.remove("picked","right"));
      if(!picked) return; answered++;
      box.querySelectorAll(".opt")[q.a].classList.add("right");
      picked.closest(".opt").classList.add("picked");
      if(+picked.value===q.a){right++;box.classList.add("ok");} else box.classList.add("bad");
    });
    $("#quizScore").textContent = answered<QUIZ_1.length ? `Ответь на все вопросы: осталось ${QUIZ_1.length-answered}.` : (right===QUIZ_1.length ? "4 из 4. Можно отмечать урок." : `${right} из ${QUIZ_1.length}. Прочитай пояснения под вопросами и попробуй ещё раз.`);
  };
}

/* ---------- маршрут ---------- */
function route(){
  const h=(location.hash||"#programma").slice(1);
  const m=/^urok-(\d+)$/.exec(h);
  const n=m?+m[1]:0;
  renderRail(n);
  if(n) renderLesson(n); else renderHome();
  closeRail();
  window.scrollTo(0,0);
}
function openRail(){$("#rail").classList.add("open");$("#scrim").classList.add("on");}
function closeRail(){$("#rail").classList.remove("open");$("#scrim").classList.remove("on");}
$("#menuBtn").onclick=openRail;
$("#scrim").onclick=closeRail;
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-copy]"); if(b){copyText(b.closest(".code").querySelector("pre").dataset.src,b);return;}
  const p=e.target.closest("[data-copy-prompt]"); if(p){copyText(p.parentElement.textContent.replace(/Скопировать$/,"").trim(),p);}
});
window.addEventListener("hashchange",route);
renderProgress();
route();
</script>
