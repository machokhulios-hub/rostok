<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Росток</title>
<meta name="theme-color" content="#0A0F0D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Росток">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#EEF0EB; --card:#FFFFFF; --ink:#18262B; --mute:#5E6E73; --line:#D8DDD6; --soft:#E3E7E0; --box:#B9C1B8;
  --accent:#D9531E; --accent-ink:#FFFFFF; --done:#2F8F5B; --full:#23744A; --part:#BFE0CC; --part-ink:#18262B;
  --bad:#C23B3B; --hero:#18262B; --hero-ink:#FFFFFF;
  --c-eng:#2F6FDB; --c-rus:#C23B3B; --c-code:#0E8F8A; --c-ai:#7B5CD6; --c-poem:#C2417A; --c-read:#B7791F; --c-music:#5B8C2A; --c-book:#7A5A3A; --c-plan:#5E6E73;
  --f-d:'Oswald','Arial Narrow',sans-serif; --f-b:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11191C; --card:#1A2529; --ink:#E8EDEA; --mute:#97A6AB; --line:#2B3A3F; --soft:#223035; --box:#4A5C61;
    --accent:#FF8A4C; --accent-ink:#1A1208; --done:#3FB273; --full:#2E8F5A; --part:#2C4A3A; --part-ink:#E8EDEA;
    --bad:#FF7B7B; --hero:#24343A; --hero-ink:#F2F5F3;
    --c-eng:#6FA3FF; --c-rus:#FF7B7B; --c-code:#46C9C2; --c-ai:#A890F2; --c-poem:#F07DB0; --c-read:#E9B14F; --c-music:#9BCF5C; --c-book:#C99A6B; --c-plan:#97A6AB;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:64px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-d);font-weight:600;margin:0;text-wrap:balance}
main{max-width:520px;margin:0 auto;
  padding-top:calc(env(safe-area-inset-top,0px) + 20px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 100px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.full{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.view{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:12.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.h1{font-size:30px;line-height:1.05;text-transform:uppercase;letter-spacing:.01em}
.h2{font-size:18px;letter-spacing:.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.muted{color:var(--mute);font-size:13.5px;margin:0}
.small{font-size:12.5px;color:var(--mute)}
.title{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.back{border:0;background:none;color:var(--accent);font-size:14px;font-weight:600;padding:6px 0;text-align:left;align-self:flex-start}
.dot{flex:none;width:9px;height:9px;border-radius:2px;display:inline-block}
.row{display:flex;align-items:center;gap:8px}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.bar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%}
.pill{font-size:12px;font-weight:600;border:1px solid currentColor;border-radius:6px;padding:0 7px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:8px}
/* Сегодня */
.brand{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}
.brand b{font-family:var(--f-d);font-weight:600;font-size:17px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
.brand span::before{content:"·";margin-right:8px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav{flex:none;width:44px;height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;display:grid;place-items:center;padding:0}
.nav[disabled]{opacity:.35;cursor:default}
.nav svg{width:20px;height:20px}
.sumcard{display:flex;align-items:center;gap:16px}
.sumcard .big{font-family:var(--f-d);font-size:22px;font-weight:500;line-height:1.2}
.ring{flex:none}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--soft);padding:3px;border-radius:10px}
.modes button{border:0;background:none;border-radius:8px;padding:10px 4px;font-size:13.5px;color:var(--mute)}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tasks{list-style:none;margin:0;padding:0 16px}
.task{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{flex:none;width:30px;height:30px;border:2px solid var(--box);border-radius:8px;background:none;display:grid;place-items:center;padding:0;margin-top:-2px}
.chk svg{width:17px;height:17px;opacity:0}
.task.done .chk{background:var(--done);border-color:var(--done)}
.task.done .chk svg{opacity:1}
.tb{flex:1;min-width:0}
.tt{font-weight:600;display:flex;align-items:center;gap:8px}
.tn{color:var(--mute);font-size:13.5px;margin-top:2px}
.task.done .tt span,.task.done .tn{opacity:.55;text-decoration:line-through}
.go{border:0;background:none;padding:4px 0 0;color:var(--accent);font-size:13px;font-weight:600}
.min{flex:none;font-family:var(--f-d);font-size:16px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
.banner{display:flex;align-items:center;gap:12px;background:var(--hero);color:var(--hero-ink);border-radius:12px;padding:12px 14px}
.banner .tb{font-size:14px}
.banner b{font-family:var(--f-d);font-weight:500;font-size:17px;display:block}
.banner .btn{flex:none;padding:10px 14px}
/* Обучение */
.ccard{display:flex;flex-direction:column;gap:7px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ccard .nm{font-weight:600;flex:1;min-width:0}
.ccard .sub{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute)}
.ccard .sub span:last-child{text-align:right}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stages i{height:6px;border-radius:3px;background:var(--soft)}
.hero{background:var(--hero);color:var(--hero-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.hero .lab{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:inherit;opacity:.8}
.hero .tl{font-family:var(--f-d);font-size:22px;font-weight:500;line-height:1.2}
.hero .pl{font-size:14px;opacity:.85}
.hero .btn:not(.primary){background:transparent;color:var(--hero-ink);border-color:rgba(255,255,255,.3)}
.lvl{flex:none;width:64px;height:64px;border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lvl b{font-family:var(--f-d);font-size:24px;line-height:1}
.lvl span{font-size:11px}
.path{list-style:none;margin:0;padding:0 16px}
.path li{border-top:1px solid var(--line)}
.path li:first-child{border-top:0}
.step{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 0;text-align:left}
.step .tx{flex:1;min-width:0}
.step.cur .tx{font-weight:600}
.step.locked{color:var(--mute)}
.ic{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:2px solid var(--line)}
.ic.ok{background:var(--done);border-color:var(--done);color:#fff}
.ic.now{border-color:var(--accent);color:var(--accent)}
.ic.ex{border-radius:7px}
.ic.ex.ok{background:var(--done)}
.ic svg{width:15px;height:15px}
.st{font-size:12.5px;color:var(--mute);white-space:nowrap}
.st.now{color:var(--accent);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font-family:var(--f-d);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile span{font-size:12.5px;color:var(--mute)}
.tile.hot b{color:var(--accent)}
.words{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px 12px;font-size:14px}
.words .tr{color:var(--mute)}
.counter{display:flex;align-items:center;gap:12px}
.counter .val{font-family:var(--f-d);font-size:40px;font-weight:600;line-height:1;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.sq{flex:none;width:48px;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:600;padding:0}
.inl{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);flex-wrap:wrap}
.inl input{width:86px;padding:8px 10px}
.item{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.stg{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.stg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 2px;font-size:11.5px;color:var(--mute);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stg button.on{background:var(--c-music);border-color:var(--c-music);color:#fff;font-weight:600}
.del{border:0;background:none;color:var(--mute);font-size:13px;padding:4px 0}
.del.warn{color:var(--bad);font-weight:600}
/* Экзамен */
.qbar{display:grid;gap:3px}
.qbar i{height:6px;border-radius:3px;background:var(--line)}
.qbar i.ok{background:var(--done)} .qbar i.no{background:var(--bad)} .qbar i.cur{background:var(--ink)}
.qcard{display:flex;flex-direction:column;gap:8px}
.qtext{font-family:var(--f-d);font-size:24px;font-weight:500;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px 16px;font-size:16px}
.opt.sel{border:2px solid var(--c-eng);padding:13px 15px;font-weight:600}
.opt.right{border:2px solid var(--done);padding:13px 15px;background:var(--part);color:var(--part-ink);font-weight:600}
.opt.wrong{border:2px solid var(--bad);padding:13px 15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.chips.built{border:1px dashed var(--box);border-radius:12px;padding:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-size:16px;font-weight:500}
.feedback{border-radius:12px;padding:12px 14px;font-size:14.5px}
.feedback.ok{background:var(--part);color:var(--part-ink)}
.feedback.no{background:var(--card);border:2px solid var(--bad)}
.score{display:flex;align-items:center;gap:16px}
.score .pct{font-family:var(--f-d);font-size:46px;font-weight:600;line-height:1}
.badge{align-self:flex-start;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:600;color:#fff}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 84px 44px;align-items:center;gap:10px;font-size:13.5px;padding:4px 0}
.trow .v{font-family:var(--f-d);font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.err{display:flex;flex-direction:column;gap:2px;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.err:first-of-type{border-top:0}
.err s{color:var(--bad)} .err b{color:var(--done);font-weight:600}
/* Карточки слов */
.flash{min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.flash .w{font-family:var(--f-d);font-size:38px;font-weight:600;line-height:1.1}
.flash .t{font-size:18px;color:var(--mute)}
.flash .r{font-size:22px;font-weight:600}
/* Мой рост */
.dows,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dows{font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;text-align:center}
.cell{position:relative;height:42px;border:1px solid var(--line);border-radius:9px;background:none;padding:0;font-family:var(--f-d);font-size:16px;font-variant-numeric:tabular-nums}
.cell.full{background:var(--full);border-color:var(--full);color:#fff}
.cell.part{background:var(--part);border-color:var(--part);color:var(--part-ink)}
.cell.today{border:2px solid var(--accent);font-weight:600}
.cell.shift::after{content:"";position:absolute;left:50%;bottom:4px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:currentColor}
.cell .m{position:absolute;top:2px;left:5px;font-family:var(--f-b);font-size:9px;letter-spacing:.04em;opacity:.75}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mute);padding-top:10px}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.chart svg{display:block;width:100%;height:auto}
.awards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px;text-align:center;font-size:11.5px;line-height:1.25}
.aw{display:flex;flex-direction:column;align-items:center;gap:6px}
.aw .c{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-d);font-size:15px;font-weight:600;color:#fff;background:var(--accent)}
.aw.off{color:var(--mute)}
.aw.off .c{background:none;border:2px dashed var(--box);color:var(--mute)}
.lab{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--mute)}
.ver{text-align:center;color:var(--mute);font-size:12px}
/* Нижнее меню */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.tab{border:0;background:none;height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--mute);font-weight:500}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:7;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
.modal{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.modal .card{width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px}
.modal textarea{min-height:160px;font-size:13px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0}
.qtext.sm{font-size:19px}
.opts.row2{flex-direction:row;flex-wrap:wrap}.opts.row2 .opt{flex:1 1 calc(50% - 4px);text-align:center}
.poemtxt{white-space:pre-wrap;font-size:16.5px;line-height:1.6;color:var(--ink);margin:6px 0 12px}
.lnk{color:var(--accent)}
.rule{border-left:3px solid var(--accent);padding-left:12px;font-size:15.5px}
.exm{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.ex{background:var(--soft);border-radius:8px;padding:2px 8px;font-weight:600}
.btn[disabled]{opacity:.6;cursor:default}
@media (prefers-reduced-motion:no-preference){.chk,.cell,.modes button,.opt{transition:background .15s,border-color .15s}}

/* Росток 4.0 — спокойная типографика, ясная иерархия и удобный ритм. */
:root{--bg:#F5F3EE;--card:#FFFEFA;--ink:#252D28;--mute:#6B746D;--line:#DDDCD3;--soft:#E9E9DF;--box:#A1ADA1;--accent:#AC481F;--accent-ink:#fff;--done:#397455;--full:#285C42;--part:#DFEADD;--part-ink:#233D2C;--hero:#253C31;--hero-ink:#F9F8F1;--f-d:'Onest',system-ui,sans-serif;--focus-ring:rgba(172,72,31,.15)}
body{font-size:15px;line-height:1.55;background:var(--bg)}
main{max-width:1120px;padding:32px 24px 120px}
main.full{max-width:800px;margin:0 auto;padding-bottom:80px}
.view{gap:24px}.h1{font-size:clamp(28px,3.6vw,44px);font-weight:600;line-height:1.15;letter-spacing:-.045em;text-transform:none;text-wrap:balance}.h2,h2{font-size:21px;line-height:1.3;letter-spacing:-.025em}h3{font-size:15px;margin:0 0 5px;font-weight:600}.eyebrow{display:block;font-size:10px;letter-spacing:.13em;font-weight:600}.muted{font-size:14px}.small{font-size:12px;line-height:1.6}.page-heading{display:flex;flex-direction:column;gap:9px;padding:12px 0 4px}.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.edition{font-size:9px;letter-spacing:.12em;color:var(--mute)}
.brand{gap:10px}.brand b{text-transform:none;font-size:19px;letter-spacing:-.03em;color:var(--ink)}.brand span::before{content:none}.brand .brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:var(--hero);color:var(--hero-ink);font-size:24px;font-weight:600;letter-spacing:-.1em;padding-right:4px}.brand>span:last-child{font-size:11px}

/* Росток 4.3 — по макету: тёмное боковое меню, фото-шапка со стеклянными карточками, фото-курсы, урок по шагам. */
:root,:root[data-theme=light]{--bg:#F3F5F4;--card:#FFFFFF;--ink:#101A15;--mute:#68766E;--line:#E3E9E5;--soft:#F1F5F2;--box:#B9C4BD;--accent:#1F9D55;--accent-ink:#FFFFFF;--done:#1F9D55;--full:#1F8A4C;--part:#DCF3E4;--part-ink:#14532D;--bad:#D93636;--chart-soft:#DCEFE2;--chart-bar:#7FD3A0;--chart-full:#1F9D55;--chip:#ECF0ED;--chip-on:#1D6B3D;--chip-on-ink:#FFFFFF;--tip:#E8F6EC;--tip-ink:#1C5A35;--hero:#0F2D1F;--hero-ink:#F3FAF5;--focus-ring:rgba(31,157,85,.22);

:root[data-theme=dark]{--bg:#0A0F0D;--card:#141B17;--ink:#EEF3F0;--mute:#8F9C95;--line:#212A25;--soft:#18201C;--box:#55615A;--accent:#4ADE80;--accent-ink:#06210F;--done:#4ADE80;--full:#4ADE80;--part:#163A25;--part-ink:#D7F5E2;--bad:#F87171;--chart-soft:#1D2A23;--chart-bar:#2F8F57;--chart-full:#4ADE80;--chip:#1A221E;--chip-on:#4ADE80;--chip-on-ink:#06210F;--tip:#13291C;--tip-ink:#B8EDC9;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3,.h1,.h2{font-family:'Onest',system-ui,sans-serif;text-transform:none}
.h1{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.12}
.h2,h2{font-size:19px;font-weight:700;letter-spacing:-.015em}
.only-d{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:none}
.card-h{margin-bottom:12px}
.btn{border-radius:12px;min-height:46px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;box-shadow:none}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:none}
.btn.block{width:100%}
.btn.small-btn{min-height:38px;padding:0 14px;font-size:13px}
.icon-btn{width:40px;height:40px;min-height:40px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;padding:0;flex:none;position:relative}
.icon-btn svg{width:22px;height:22px}
.icon-btn.plain{width:32px;height:32px;min-height:32px}
.icon-btn.plain svg{width:18px;height:18px}
.link{border:0;background:none;color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;padding:6px 0;white-space:nowrap;min-height:0}
.link svg{width:17px;height:17px}
.back{color:var(--accent);min-height:0}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.dot.big{width:12px;height:12px}
.bar{height:6px;border-radius:99px;background:var(--chart-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:inherit}
.chart-svg{width:100%;height:auto;display:block}
.eyebrow{color:var(--mute);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.muted{color:var(--mute)}
.view{display:flex;flex-direction:column;gap:16px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px}
select{padding-right:30px}

/* меню: телефон — снизу */
nav#tabbar{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-width:none;margin:0;border:0;border-top:1px solid var(--line);border-radius:0;background:var(--card);box-shadow:none;padding:0 0 env(safe-area-inset-bottom,0px);overflow:visible;z-index:20}
nav#tabbar::before,nav#tabbar::after{content:none}
nav#tabbar .side{display:none}
nav#tabbar .bottom{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:600px;margin:0 auto}
nav#tabbar .tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:64px;font-size:11px;font-weight:500;color:var(--mute);border:0;background:transparent;border-radius:0;padding:0}
nav#tabbar .tab svg{width:24px;height:24px}
nav#tabbar .tab[aria-current=page]{color:var(--accent);background:transparent}
nav#tabbar .bottom .tab[aria-current=page] svg{fill:var(--part)}
body.app-full nav#tabbar{display:none}
main#app{max-width:600px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
main#app.full{padding-bottom:calc(env(safe-area-inset-bottom,0px) + 32px)}
:root:not([data-theme]) body,:root[data-theme=dark] body{background:var(--bg)}

/* шапка страниц */
.topbar{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tb-title{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.tb-title .muted{font-size:14px;margin:0}
.head-tools{display:flex;align-items:center;gap:4px;flex:none;position:relative}
.search{position:relative;display:flex;align-items:center}
.search input{display:none}
.search-results,.bell-pop{position:absolute;top:calc(100% + 8px);right:0;width:min(400px,calc(100vw - 32px));background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 40px rgba(0,0,0,.22);padding:8px;z-index:40;max-height:380px;overflow:auto;text-align:left}
.search-results .small,.bell-pop .small{padding:8px 10px;margin:0}
.search-item,.bell-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;font-size:14px;color:var(--ink);min-height:44px}
.search-item small,.bell-item small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.search-item em{margin-left:auto;font-style:normal;font-size:11px;color:var(--accent);white-space:nowrap}
.search-item:hover,.bell-item:hover{background:var(--soft)}
.bell-item{flex-direction:column;align-items:flex-start;gap:0}
.bell-h{display:block;padding:6px 10px 4px;font-size:13px}
.bell{position:relative}
.bell-dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:#EF4444;border:2px solid var(--bg)}
.avatar{width:38px;height:38px;min-height:38px;border-radius:50%;border:0;background:#111;color:#fff;font-weight:700;font-size:15px;display:grid;place-items:center;padding:0;flex:none}
.search.open{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:45}
.search.open input{display:block;flex:1;padding-right:48px;border-radius:999px;background:var(--card)}
.search.open .s-btn{position:absolute;right:4px}
.search.open .search-results{left:0;right:0;width:auto}

/* Главная */
.m-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.m-head .brand,.side-brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:22px;letter-spacing:.01em;color:var(--ink)}
.m-head .brand svg,.side-brand svg{width:28px;height:28px;color:var(--accent)}
.hero{position:relative;overflow:hidden;color:#fff;background:#0B1A12}
.hero-bg{position:absolute;inset:0;background:url(img/hero.jpg) 72% 55%/cover no-repeat}
.hero-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,13,0) 35%,rgba(10,15,13,.92) 100%),linear-gradient(90deg,rgba(6,14,10,.55) 0%,rgba(6,14,10,0) 60%)}
.hero-main{position:relative;z-index:1}
.hero-leaf{display:inline-grid;color:var(--accent)}
.hero-leaf svg{width:30px;height:30px}
.hero-title{margin:0;color:#fff;font-weight:800;letter-spacing:-.03em;line-height:1.1;text-wrap:balance}
.hero-quote span,.quote-card>span,.tip>span{display:inline-grid;color:var(--accent)}
.home-view .hero{border-radius:0;margin:0 -16px;min-height:236px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px 18px}
.home-view .hero-copy{display:flex;flex-direction:column;gap:12px}
.home-view .hero-copy .hero-leaf{position:absolute;top:-150px}
.home-view .hero-title{font-size:28px}
.m-date{margin:-6px 0 0;color:var(--mute);font-size:15px}
.week-strip .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.week-strip .week-nav{display:none}
.wday{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border:0;background:none;color:var(--ink);border-radius:12px;min-height:58px}
.wday:not(:last-child)::after{content:'';position:absolute;right:0;top:12px;bottom:12px;width:1px;background:var(--line)}
.wday span{font-size:13px;color:var(--mute)}
.wday b{font-size:16px;font-weight:600}
.wday.today b{color:var(--accent)}
.wday.sel{background:#86E3A3;color:#06210F}
.wday.sel span,.wday.sel b{color:#06210F}
.wday.sel::after,.wday:has(+.wday.sel)::after{opacity:0}
.wday.part b::before,.wday.full b::before{content:'';position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.wday.sel.part b::before,.wday.sel.full b::before{background:#06210F}
.today-panel{display:flex;flex-direction:column;gap:12px}
.tp-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tp-head h2{font-size:21px;margin:0 0 3px}
.tp-head .muted{margin:0;font-size:14px}
.tp-box h3{margin:0;font-size:15px;font-weight:700}
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);min-height:56px}
.task:last-child{border-bottom:0}
.task .chk{width:28px;height:28px;min-height:28px;border-radius:50%;border:2px solid var(--box);background:transparent;display:grid;place-items:center;padding:0;flex:none;margin:0}
.task .chk svg{width:15px;height:15px;opacity:0}
.task.done .chk{background:var(--accent);border-color:var(--accent)}
.task.done .chk svg{opacity:1}
.task.done .chk svg path{stroke:var(--accent-ink)}
.t-label{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--ink);font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0}
.task.done .t-label{color:var(--mute)}
.t-min{flex:none;font-size:13.5px;color:var(--mute);white-space:nowrap}
.t-time{flex:none;width:46px;font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.del-task{width:30px;height:30px;min-height:30px;color:var(--mute)}
.del-task svg{width:16px;height:16px}
.m-cta{min-height:54px;font-size:16px;border-radius:16px;margin-top:4px}

/* Обучение */
.chips{display:flex;flex-wrap:nowrap;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;min-height:0}
.chips::-webkit-scrollbar{display:none}
.chip{border:0;background:var(--chip);color:var(--ink);border-radius:999px;padding:0 18px;min-height:40px;font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink);font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.seg .chip{min-height:46px;padding:0 6px}
.course-grid{display:grid;grid-template-columns:1fr;gap:14px}
.ccard{position:relative;display:flex;flex-direction:row-reverse;min-height:148px;border-radius:18px;overflow:hidden;background:#F3F4F2;color:#121512;border:1px solid var(--line);padding:0;gap:0}
.cc-photo{width:44%;flex:none;position:relative;background:#222}
.cc-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.cc-art{display:grid;place-items:center;background:linear-gradient(150deg,rgba(255,255,255,.25),rgba(0,0,0,.35)),var(--cc);color:#fff}
.cc-art svg{width:48px;height:48px}
.cc-body{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:16px 16px 14px;border:0;background:none;text-align:left;color:inherit;min-height:0}
.cc-body::after{content:'';position:absolute;inset:0}
.cc-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;width:100%}
.cc-top .nm{font-size:16.5px;font-weight:700;letter-spacing:-.01em;line-height:1.25;-webkit-hyphens:auto;hyphens:auto}
.cc-pct,.cc-desc,.cc-bar{display:none}
.cc-meta{font-size:14px;color:#62706A}
.cc-go{margin-top:auto;display:inline-flex;align-items:center;gap:6px;color:#1F8A4C;font-weight:600;font-size:15px}
.cc-go svg{width:17px;height:17px}
.fav{position:absolute;z-index:2;left:8px;top:8px;width:34px;height:34px;min-height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.38);color:#fff;display:grid;place-items:center;padding:0}
.fav svg{width:17px;height:17px}
.fav[aria-pressed=true]{color:#FACC15}
.fav[aria-pressed=true] svg{fill:#FACC15}
.empty-note{grid-column:1/-1}

/* курс, урок */
.lesson-top{display:flex;align-items:center;gap:10px;justify-content:space-between}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--mute);min-width:0}
.crumbs button{border:0;background:none;color:var(--mute);padding:4px 2px;min-height:0;font-size:13px}
.crumbs button:first-child{color:var(--ink)}
.crumbs svg{width:14px;height:14px}
.crumbs button:not(:first-child),.crumbs>svg{display:none}
.crumbs>span{display:none}
.lesson-head{display:flex;flex-direction:column;gap:12px}
.l-progress{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute);white-space:nowrap}
.l-progress .bar{flex:1;height:6px}
.lesson-grid{display:flex;flex-direction:column;gap:14px}
.lesson-steps{list-style:none;margin:0;padding:6px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;border-radius:16px}
.lesson-steps::-webkit-scrollbar{display:none}
.lesson-steps li button{display:flex;align-items:center;gap:8px;justify-content:space-between;width:100%;border:0;background:none;color:var(--mute);padding:10px 12px;border-radius:12px;font-size:14px;text-align:left;white-space:nowrap;min-height:42px}
.lesson-steps li button svg{width:16px;height:16px;flex:none}
.lesson-steps li button.ok{color:var(--ink)}
.lesson-steps li button.wrong{color:var(--bad)}
.lesson-steps li button.active{background:var(--tip);color:var(--tip-ink);font-weight:600}
.lesson-main{display:flex;flex-direction:column;gap:16px;padding:20px}
.lsec{display:flex;flex-direction:column;gap:14px}
.lsec[hidden]{display:none!important}
.l-lead{font-size:16.5px;line-height:1.65;margin:0}
.ex-list{display:flex;flex-direction:column;gap:8px}
.code-block{background:#0E1512;color:#E3ECE6;border-radius:16px;overflow:hidden}
.code-h{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:12.5px;color:#93A39A;border-bottom:1px solid rgba(255,255,255,.07)}
.copy-btn{border:0;background:none;color:#DDE6E0;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;min-height:0;padding:2px}
.copy-btn svg{width:15px;height:15px}
.code-block pre{margin:0;padding:16px;overflow-x:auto;font-size:14px;line-height:1.6}
.code-block code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#E7F0EA;white-space:pre-wrap}
.code-c{margin:0;padding:0 16px 14px;font-size:13px;color:#9FB0A6}
.tip{display:flex;gap:12px;align-items:flex-start;background:var(--tip);color:var(--tip-ink);border-radius:16px;padding:16px;font-size:14.5px;line-height:1.55}
.tip>span svg{width:22px;height:22px}
.tip p{margin:0}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;padding-top:6px}
.lesson-nav .btn{min-width:130px}
.qtext.sm{font-size:20px;font-weight:600;line-height:1.35}

/* План дня */
.pd-nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pd-nav .nav{width:42px;height:42px;min-height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0;color:var(--ink)}
.pd-nav .nav svg{width:18px;height:18px}
.pd-nav .nav[disabled]{opacity:.35}
.pd-date{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0}
.pd-date b{font-size:17px}
.pd-mode{display:flex;align-items:center;gap:12px;justify-content:space-between}
.pd-mode .modes{flex:1;max-width:360px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border-radius:12px;padding:4px}
.pd-mode .modes button{border:0;background:transparent;border-radius:9px;min-height:36px;font-size:13px;color:var(--ink)}
.pd-mode .modes button[aria-pressed=true]{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.timeline{padding:6px 18px 18px}
.t-note{margin:8px 0 0}
.add-task{margin-top:14px;text-align:center}
.add-task summary{display:inline-flex;align-items:center;justify-content:center;gap:8px;list-style:none;cursor:pointer;min-height:50px;padding:0 28px;border-radius:14px;border:1.5px solid var(--accent);color:var(--accent);font-weight:600;font-size:15px}
.add-task summary::-webkit-details-marker{display:none}
.add-task summary svg{width:18px;height:18px}
.add-form{display:grid;grid-template-columns:1fr 80px;gap:8px;margin-top:12px;text-align:left}
.add-form .btn{grid-column:1/-1}
.quote-card{display:flex;gap:14px;align-items:center;background:var(--tip);border-radius:18px;padding:20px}
.quote-card>span svg{width:30px;height:30px}
.quote-card p{margin:0;font-size:17px;line-height:1.45;color:var(--tip-ink);font-weight:500}

/* Статистика, привычки, цели и прочее */
.stat-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:4px;min-height:0}
.tile b{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.tile span{font-size:12px;color:var(--mute);line-height:1.3}
.dist-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) 46px;gap:12px;align-items:center;padding:9px 0;font-size:14px;width:100%;border:0;background:none;color:var(--ink);text-align:left;min-height:0}
.dist-row .row{display:flex;align-items:center;gap:10px;min-width:0}
.dist-row .bar{height:10px}
.dist-row .v{text-align:right;font-weight:600;font-size:13.5px}
.level{font-size:20px}
.level-card{display:flex;flex-direction:column;gap:10px}
.habit{display:flex;align-items:center;gap:14px;padding:14px 16px}
.habit .chk{width:32px;height:32px;min-height:32px;border-radius:50%;border:2px solid var(--box);background:transparent;display:grid;place-items:center;padding:0;flex:none}
.habit .chk svg{width:16px;height:16px;opacity:0}
.habit .chk.on{background:var(--accent);border-color:var(--accent)}
.habit .chk.on svg{opacity:1}
.habit .chk.on svg path{stroke:var(--accent-ink)}
.habit .chk[disabled]{opacity:.35}
.habit-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.habit-main b{display:flex;align-items:center;gap:8px;font-size:15.5px}
.habit-week{display:grid;grid-template-columns:repeat(7,12px);gap:4px;flex:none}
.habit-week i{width:12px;height:12px;border-radius:3px;border:1px solid var(--line)}
.habit-week i.ok{background:var(--accent);border-color:var(--accent)}
.habit-week i.miss{background:var(--chart-soft)}
.habit-week i.now{border-color:var(--accent)}
.note-form{display:flex;flex-direction:column;gap:10px}
.note-form textarea{min-height:110px}
.notes-grid,.goals-grid,.tools-grid,.lib-grid{display:grid;grid-template-columns:1fr;gap:12px}
.note-card{display:flex;flex-direction:column;gap:8px}
.note-x{margin:0;white-space:pre-wrap;line-height:1.5;font-size:14.5px}
.old-note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
#note-filter{width:100%}
.goal{display:flex;flex-direction:column;gap:10px;text-align:left;color:var(--ink);min-height:0}
.goal b{font-size:15.5px}
.goal em{font-style:normal;font-weight:700;color:var(--cc)}
.goal .bar{height:8px}
.lib-list{list-style:none;margin:8px 0 0;padding:0}
.lib-list li{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.lib-list li:last-child{border-bottom:0}
.link-row{border:0;background:none;padding:0;color:var(--ink);text-align:left;font-size:14px;min-height:0}
.lib-course summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;min-height:30px}
.lib-course summary::-webkit-details-marker{display:none}
.lib-course summary .small{margin-left:auto}
.theme-card{display:flex;flex-direction:column;gap:10px}
.theme-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);border-radius:12px;padding:4px}
.theme-switch button{border:0;background:transparent;color:var(--ink);font-size:13px;padding:6px 4px;border-radius:9px;min-height:38px;font-weight:500}
.theme-switch button[aria-pressed=true]{background:var(--chip-on);color:var(--chip-on-ink);font-weight:600}
.more-list{padding:6px}
.more-row{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--ink);text-align:left;padding:12px;border-radius:12px;min-height:60px}
.more-row>svg{width:18px;height:18px;color:var(--mute);margin-left:auto}
.more-row b{display:block;font-size:15.5px}
.more-row small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.more-ic{width:40px;height:40px;border-radius:12px;background:var(--part);color:var(--accent);display:grid;place-items:center;flex:none}
.more-ic svg{width:21px;height:21px}
.growth-view .week-panel{background:radial-gradient(120% 150% at 88% 0%,#21683F 0%,#0F2D1F 52%,#0A2016 100%);color:#F3FAF5;border-radius:20px;padding:22px}
.week-switch button[aria-pressed=true]{background:#4ADE80;border-color:#4ADE80;color:#06210F}
.delta{display:inline-block;align-self:flex-end;background:var(--part);color:var(--part-ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
.delta.down{background:#FDE2E2;color:#B42318}
.legend-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:13.5px;flex:1;min-width:0}
.legend-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.legend-list b{font-weight:600}
.overall-row{display:flex;align-items:center;gap:20px}
.donut{flex:none}

/* ===== планшет и компьютер ===== */
@media(min-width:768px){
  .only-m{display:none!important}
  .only-d{display:revert!important}
  span.only-d,b.only-d,i.only-d{display:inline!important}
  button.only-d,a.only-d.ccard{display:flex!important}
  .hero-btn.only-d{display:inline-flex!important}
  .h1{font-size:32px}
  nav#tabbar{top:0;bottom:0;left:0;right:auto;width:240px;border:0;padding:22px 14px 18px;background:linear-gradient(180deg,#0E2119 0%,#0A1611 100%);color:#C7D4CC;display:flex;flex-direction:column}
  body.app-full nav#tabbar{display:flex}
  nav#tabbar .bottom{display:none}
  nav#tabbar .side{display:flex;flex-direction:column;height:100%}
  nav#tabbar .side-brand{padding:4px 10px 26px;color:#fff;font-size:22px}
  nav#tabbar .side-brand svg{color:#4ADE80}
  nav#tabbar .side-list{display:flex;flex-direction:column;gap:4px}
  nav#tabbar .tab{flex-direction:row;justify-content:flex-start;gap:13px;height:46px;padding:0 14px;border-radius:12px;color:#BFCDC5;font-size:14.5px;font-weight:500}
  nav#tabbar .tab svg{width:21px;height:21px;fill:none}
  nav#tabbar .tab:hover{background:rgba(255,255,255,.06);color:#fff}
  nav#tabbar .tab[aria-current=page]{background:linear-gradient(90deg,#1F8A4C,#239B55);color:#fff}
  nav#tabbar .side-settings{margin-top:auto}
  nav#tabbar .side-settings svg:last-child{margin-left:auto;width:17px;height:17px}
  main#app,main#app.full{max-width:none;margin:0 0 0 240px;padding:26px 34px 56px}
  main#app>*{max-width:1200px;margin-left:auto;margin-right:auto}
  .view{gap:20px}
  .search input{display:block;width:300px;border-radius:999px;padding:10px 44px 10px 18px;min-height:44px;background:var(--card)}
  .search .s-btn{position:absolute;right:4px;width:36px;height:36px;min-height:36px}
  .search.open{position:relative;left:auto;right:auto;top:auto}
  .topbar{align-items:flex-start;flex-wrap:nowrap;gap:16px}
  .sort select{min-height:44px;border-radius:12px}

  /* Главная: фото, стеклянные карточки, белая панель */
  .home-view{gap:0}
  .home-view .hero{margin:0;border-radius:22px 22px 0 0;min-height:0;padding:22px 34px 26px;display:block}
  .hero-bg{background-position:62% 55%}
  .hero-bg::after{background:linear-gradient(90deg,rgba(5,14,9,.82) 0%,rgba(5,14,9,.45) 38%,rgba(5,14,9,.05) 65%,rgba(5,14,9,.2) 100%),linear-gradient(180deg,rgba(5,14,9,0) 45%,rgba(5,14,9,.75) 100%)}
  .hero-top{position:relative;z-index:2;display:flex!important;align-items:center;justify-content:space-between}
  .hero-top .icon-btn{color:#fff}
  .hero-top .search input{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  .hero-top .search input::placeholder{color:rgba(255,255,255,.75)}
  .hero-top .avatar{background:#0B0F0D;border:1.5px solid rgba(255,255,255,.7)}
  .hero-top .bell-dot{border-color:transparent}
  .hero-main{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-top:22px}
  .home-view .hero-copy{max-width:470px;gap:0}
  .home-view .hero-title{font-size:56px;letter-spacing:-.035em}
  .hero-tag{margin:14px 0 0;font-size:22px;font-weight:600;color:#fff}
